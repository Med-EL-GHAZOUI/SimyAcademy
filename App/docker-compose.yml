version: '3.9'

services:

  postgres:
    image: postgres:16
    container_name: edumaroc-postgres
    environment:
      POSTGRES_DB: edumaroc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: edumaroc-redis
    ports:
      - "6379:6379"

  pgadmin:
    image: dpage/pgadmin4
    container_name: edumaroc-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@edumaroc.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data: